<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#573923" />
      <stop offset="100%" stop-color="#392719" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B368" />
      <stop offset="50%" stop-color="#C69B56" />
      <stop offset="100%" stop-color="#9C7438" />
    </linearGradient>
  </defs>
  <!-- Walnut Timber Base -->
  <rect width="64" height="64" rx="14" fill="url(#woodGrad)" stroke="#B88752" stroke-width="2"/>
  <!-- Brass Inlay Border -->
  <rect x="5" y="5" width="54" height="54" rx="10" fill="none" stroke="url(#brassGrad)" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- Crafted Monogram "V" -->
  <path d="M19 18 L32 46 L45 18" fill="none" stroke="url(#brassGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="46" r="2.5" fill="#FFF7EB"/>
  <circle cx="19" cy="18" r="2" fill="url(#brassGrad)"/>
  <circle cx="45" cy="18" r="2" fill="url(#brassGrad)"/>
</svg>
