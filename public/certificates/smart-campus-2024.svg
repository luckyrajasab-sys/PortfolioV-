      <stop offset="0%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#171720"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="550" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="750" height="500" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="40" y="40" width="720" height="470" rx="12" fill="#0B0B0F" fill-opacity="0.85" stroke="#262635" stroke-width="1.5"/>

  <text x="400" y="110" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#22D3EE" letter-spacing="4" text-anchor="middle" font-weight="600">CERTIFICATE OF RECOGNITION</text>
  
  <text x="400" y="175" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#EDEDF0" font-weight="700" text-anchor="middle">Smart Campus Hackathon 2024</text>
  <text x="400" y="210" font-family="'Inter', sans-serif" font-size="16" fill="#A1A1AA" text-anchor="middle">Awarded to</text>
  
  <text x="400" y="270" font-family="'Space Grotesk', sans-serif" font-size="36" fill="#7C5CFF" font-weight="700" text-anchor="middle">Aarav Sharma</text>
  <line x1="260" y1="285" x2="540" y2="285" stroke="#7C5CFF" stroke-width="2"/>

  <text x="400" y="335" font-family="'Inter', sans-serif" font-size="15" fill="#EDEDF0" text-anchor="middle">for securing 1st Runner Up (2nd Place) out of 48 participating teams</text>
  <text x="400" y="365" font-family="'Inter', sans-serif" font-size="14" fill="#71717A" text-anchor="middle">Demonstrating excellence in Full Stack Development &amp; Hardware Lab Concurrency</text>

  <g transform="translate(140, 420)">
    <line x1="0" y1="35" x2="180" y2="35" stroke="#3F3F46" stroke-width="1"/>
