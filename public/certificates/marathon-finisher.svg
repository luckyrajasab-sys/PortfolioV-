<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="marathonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="#0B1310"/>
  <rect x="25" y="25" width="750" height="500" rx="16" fill="none" stroke="url(#marathonGrad)" stroke-width="2"/>
  <rect x="40" y="40" width="720" height="470" rx="12" fill="#0E1A16" stroke="#1C382D" stroke-width="1.5"/>

  <text x="400" y="105" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#34D399" letter-spacing="4" text-anchor="middle" font-weight="600">OFFICIAL FINISHER CERTIFICATE</text>
  <text x="400" y="165" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#EDEDF0" font-weight="700" text-anchor="middle">Sole for Souls Marathon</text>
  <text x="400" y="200" font-family="'Inter', sans-serif" font-size="15" fill="#A7F3D0" text-anchor="middle">Awarded to</text>
  
  <text x="400" y="260" font-family="'Space Grotesk', sans-serif" font-size="36" fill="#34D399" font-weight="700" text-anchor="middle">Vishwa</text>
  <line x1="260" y1="275" x2="540" y2="275" stroke="#34D399" stroke-width="2"/>

  <text x="400" y="325" font-family="'Inter', sans-serif" font-size="16" fill="#ECFDF5" text-anchor="middle">In recognition of successfully finishing the distance run for social charity &amp; health awareness</text>
  <text x="400" y="355" font-family="'Inter', sans-serif" font-size="14" fill="#6EE7B7" text-anchor="middle">Sole for Souls Organization • Chennai</text>

  <circle cx="400" cy="435" r="32" fill="#132B22" stroke="url(#marathonGrad)" stroke-width="2"/>
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#34D399" font-weight="700" text-anchor="middle">RUN</text>
</svg>

