<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1218"/>
      <stop offset="100%" stop-color="#161B26"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="750" height="500" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="12 6"/>
  <rect x="40" y="40" width="720" height="470" rx="12" fill="#0B0E14" fill-opacity="0.9" stroke="#252F42" stroke-width="1.5"/>

  <text x="400" y="105" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#FBBF24" letter-spacing="4" text-anchor="middle" font-weight="600">STATE &amp; NATIONAL MARTIAL ARTS CHAMPIONSHIP</text>
  <text x="400" y="165" font-family="'Space Grotesk', sans-serif" font-size="32" fill="#EDEDF0" font-weight="700" text-anchor="middle">Silambam Tournament Honors</text>
  <text x="400" y="200" font-family="'Inter', sans-serif" font-size="15" fill="#94A3B8" text-anchor="middle">Awarded to</text>
  
  <text x="400" y="260" font-family="'Space Grotesk', sans-serif" font-size="38" fill="#F59E0B" font-weight="700" text-anchor="middle">Vishwa (S. Vishwa)</text>
  <line x1="260" y1="275" x2="540" y2="275" stroke="#F59E0B" stroke-width="2"/>

  <text x="400" y="325" font-family="'Inter', sans-serif" font-size="16" fill="#EDEDF0" text-anchor="middle">Winner of 4 Gold, 1 Silver, and 1 Bronze Medal (6 Total Medals)</text>
  <text x="400" y="355" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Recognized across District, State, and National Level Competitions • 7 Official Certificates</text>

  <g transform="translate(140, 420)">
    <line x1="0" y1="35" x2="180" y2="35" stroke="#334155" stroke-width="1"/>
    <text x="90" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">State Federation Secretary</text>
  </g>
  <g transform="translate(480, 420)">
    <line x1="0" y1="35" x2="180" y2="35" stroke="#334155" stroke-width="1"/>
    <text x="90" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">National Technical Jury</text>
  </g>

  <circle cx="400" cy="435" r="32" fill="#1C1F2E" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="middle">GOLD</text>
</svg>

